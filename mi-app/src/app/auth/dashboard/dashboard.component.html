<mat-toolbar color="primary">
  <span>Mi App</span>
  <span class="toolbar-spacer"></span>
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    Cerrar sesión
  </button>
</mat-toolbar>

<div class="container">
  <mat-card appearance="outlined" class="welcome-card">
    <mat-card-header>
      <mat-card-title>Hola, {{ currentUser()?.fullName }}</mat-card-title>
      <mat-card-subtitle>{{ currentUser()?.email }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="success-chip">
        <mat-chip-set>
          <mat-chip highlighted color="primary">Sesión iniciada correctamente</mat-chip>
        </mat-chip-set>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined" class="activity-card">
    <mat-card-header>
      <mat-card-title>Actividad reciente</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        @for (actividad of actividades; track actividad.name) {
          <mat-list-item>
            <mat-icon matListItemIcon>{{ actividad.icon }}</mat-icon>
            <span matListItemTitle>{{ actividad.name }}</span>
            <span matListItemMeta>
              <mat-chip>{{ actividad.status }}</mat-chip>
            </span>
          </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
